[project]
name = "runtime-service-aegra-spike"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aegra-api==0.10.4",
    "langgraph==1.2.11",
    "langgraph-sdk==0.4.3",
    "langchain[openai]>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.10",
    "langchain-deepseek>=1.0.1",
    "deepagents>=0.4.4",
    "langfuse>=4.14,<5",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.1",
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "spike: Aegra compatibility spike",
    "real_model: requires real model credentials",
    "durable: requires PostgreSQL, Redis and Aegra",
]
